# Nginx du conteneur shub-client : sert le client React compilé.
# - En local, il relaie aussi /api vers l'API (même origine → cookies SameSite=Strict, pas de CORS).
# - Sur aldebaran, Caddy envoie /api directement à shub-api : ce bloc n'est alors pas utilisé.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # éco-conception : compression des fichiers texte
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # en-têtes de sécurité : CSP stricte (seules les affiches TMDB viennent d'ailleurs)
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://image.tmdb.org; style-src 'self'; script-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # catalogue privé : aucun moteur ne doit indexer quoi que ce soit (cf. robots.txt)
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /api/ {
        proxy_pass http://shub-api:4000;
        # $remote_addr REMPLACE l'en-tête envoyé par le navigateur : un X-Forwarded-For
        # forgé par le visiteur n'arrive jamais jusqu'à l'API (cf. RG10)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
    }

    # fichiers générés par Vite : leur nom contient un hash → cache long sans risque
    # (expires et pas add_header : un add_header dans un location annulerait les en-têtes de sécurité ci-dessus)
    location /assets/ {
        expires 1y;
    }

    # application à page unique : toute adresse inconnue renvoie index.html,
    # React Router choisit ensuite la page (/films/42…)
    location / {
        try_files $uri /index.html;
        expires -1; # index.html toujours revalidé : il pointe vers les nouveaux fichiers après un déploiement
    }
}
